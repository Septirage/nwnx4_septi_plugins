# Only for example. Nothing in it is on the base game
#
# Rules adding to the physical damage of the attacks. [DamageRuleX]
#   Bonus : value or expression. Required. Can be negative (the engine keeps at least 1 damage).
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#
# The bonus behaves as the Strength bonus to damage:
#   - added to the damage of the weapon, with its damage type;
#   - every weapon and both hands (melee, ranged, unarmed), shown on the character sheet;
#   - multiplied on a critical hit (Bonus = 2 gives +6 on a x3 critical).
# Fixed values only: no dice.
#
# The character sheet is computed again when the engine sees a change (feat, effect, equipment...).
# When a rule depends on something else (CustomValue, area...), use RefreshCombatInformation_EFF.


[General]
DisableHook = 0


[DamageRule1]
Bonus = 1
Feat = 4

[DamageRule2]
Bonus = 2
Extra = InCombat & !Rule1
