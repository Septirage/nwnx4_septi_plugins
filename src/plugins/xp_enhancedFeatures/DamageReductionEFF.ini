# 948 DWARVEN DEFENDER DAMAGE REDUCTION (class 36): 3/-, then 6/- at level 10, 9/- at level 14...
[DamageReductionRule10]
Bypass = NONE
Bonus = 3
Feat = 948
Extra = ClassLevelMax(36) < 10

[DamageReductionRule11]
Bypass = NONE
Bonus = ((ClassLevelMax(36) - 6) // 4 + 1) * 3
Feat = 948
Extra = ClassLevelMax(36) >= 10

