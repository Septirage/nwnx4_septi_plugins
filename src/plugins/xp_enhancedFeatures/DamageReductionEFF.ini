# Damage reduction given by feats. THIS FILE REPLACES THE HARDCODED FEAT DAMAGE REDUCTION OF THE GAME.
#
# When this file is active, the engine no longer gives any damage reduction for feats: the rules below do it.
# As provided, the rules give exactly the same damage reduction as the base game. Change them as you want.
# Effects (spells), item properties and the creature's own damage reduction (blueprint) are not changed.
#
# [DamageReductionRuleX]
#   Bonus  : amount of damage reduction, value or expression. Required.
#   Bypass : what goes through this damage reduction. Required.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#
# Bypass (DR_TYPE_ prefix accepted):
#   NONE           : x/- (nothing goes through)
#   MAGICBONUS n   : x/+n, n = enhancement bonus of the weapon, 1 to 20 (MAGICBONUS 1 = x/magic)
#   EPIC           : x/epic (enhancement above +5)
#   GMATERIAL n    : x/material, n = GMaterial of the weapon (or of the ammunition), 0 to 255. Base game values:
#                    0 non specific, 1 adamantine, 2 cold iron, 3 darksteel, 4 iron, 5 mithral, 6 alchemical silver,
#                    7 duskwood, 8 darkwood, 9 red dragon, 10 salamander, 11 umber hulk, 12 wyvern.
#                    Materials added by your 2DA work too.
#   DMGTYPE x      : x/damage type, x = DAMAGE_TYPE_* name (SLASHING, DAMAGE_TYPE_PIERCING...) or value (4 = slashing)
#   ALIGNMENT x    : x/alignment, x = LAWFUL, CHAOTIC, GOOD or EVIL. Goes through when the attacker has a damage
#                    bonus against the opposite alignment (holy weapon...) or the monk lawful Ki Strike.
#                    The alignment of the attacker itself does not count (engine rule).
#   NON_RANGED     : applies only against a creature holding a ranged weapon.
#   Several bypasses: all joined by | (goes through with any of them: GMATERIAL 6 | GMATERIAL 2)
#                     or all joined by & (goes through only with all of them: GMATERIAL 6 & ALIGNMENT GOOD).
#                     | and & can not be mixed in one rule.
#
# How the rules combine:
#   - the rules with exactly the same Bypass are added together into one damage reduction;
#   - then, as in the base game, only the best damage reduction that is not bypassed applies (rules, effects, items).
#   - to keep only the best of several rules (no addition), exclude them with the Feat field (Feat = 216 & !1541).
#   - a total of 0 or less gives no damage reduction.
#


[General]
DisableHook = 0


