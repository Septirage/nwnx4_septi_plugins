# Only for example. Nothing in it is on the base game
#
# Rules modifying the criticals. Four kinds of rules, each with its own list and numbering:
#   [CriticalThreatRuleX]      : the threat range grows by Bonus (19-20 with Bonus = 2 gives 17-20).
#                                Added after the doubling of Improved Critical. The range never starts below 2.
#   [CriticalConfirmRuleX]     : Bonus is added to the confirmation roll.
#   [CriticalMultiplierRuleX]  : Bonus is added to the critical multiplier. Never below 1.
#   [CriticalTouchThreatRuleX] : the threat range of the touch attacks (TouchAttackMelee and TouchAttackRanged)
#                                grows by Bonus (20 with Bonus = 1 gives 19-20). The range of the game is 20, or
#                                19-20 with the feat 2109 (melee) / 2110 (ranged). Never below 2.
#                                The touch attack is only patched when at least one of these rules exists.
#
#   Bonus : value or expression. Required.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#   TouchType : [CriticalTouchThreatRuleX] only. MELEE (TouchAttackMelee), RANGED (TouchAttackRanged) or ALL (both).
#               ALL when absent. Another value: the rule is not applied (error in the log).
#
# The rules apply to every weapon and both hands (attack, damages and character sheet).
# The confirmation rules also apply to the touch attacks. The threat rules don't: use CriticalTouchThreatRule.
# The touch threat rules are checked for the creature making the touch attack, and only when the attacker is a creature.
# A reference to another rule (Rule2, !Rule2) only sees the rules of the same kind.
#
# Critical event: [CriticalEventRuleX] (own list and numbering)
#   Script : name of the script to run. Required. No Bonus.
#   Feat / Area / Extra : optional conditions, checked for the attacker only.
#   Called on a critical hit confirmed and not cancelled (critical immunity, Epic Dodge): melee, ranged and special
#   attacks, and the critical result forced by SetCombatOverrides. Not for the touch attacks (TouchAttackMelee/Ranged
#   return their result to the script). With Manyshot, only once (the main arrow: the bonus arrow is never a critical).
#   Every rule true for the attacker runs its script, in the order of the rules. The rules are all checked before
#   the first script runs. A critical happening during one of these scripts doesn't run them again.
#   The script runs before the damages of the attack are done, and can't change or cancel the critical:
#       int StartingConditional(object oAttacker, object oTarget, int bOffHand, int nMultiplier)
#   OBJECT_SELF is the attacker. nMultiplier is the critical multiplier of the attack. The return value is not used.
#   Don't destroy the attacker or the target, or move them to another area, in this script. If one of them is no
#   longer valid after a script, the next scripts are not run and the damages of this attack are skipped.
#   ResolveDamage is only patched when at least one of these rules exists.


[General]
DisableHook = 0


[CriticalThreatRule1]
Bonus = 1
Feat = 4

[CriticalConfirmRule1]
Bonus = 2
Extra = InCombat

[CriticalMultiplierRule1]
Bonus = 1
Feat = 4

