# Only for example. Nothing in it is on the base game
#
# Rules modifying the criticals. Three kinds of rules, each with its own list and numbering:
#   [CriticalThreatRuleX]     : the threat range grows by Bonus (19-20 with Bonus = 2 gives 17-20).
#                               Added after the doubling of Improved Critical. The range never starts below 2.
#   [CriticalConfirmRuleX]    : Bonus is added to the confirmation roll.
#   [CriticalMultiplierRuleX] : Bonus is added to the critical multiplier. Never below 1.
#
#   Bonus : value or expression. Required.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#
# The rules apply to every weapon and both hands (attack, damages and character sheet).
# A reference to another rule (Rule2, !Rule2) only sees the rules of the same kind.


[General]
DisableHook = 0


[CriticalThreatRule1]
Bonus = 1
Feat = 4

[CriticalConfirmRule1]
Bonus = 2
Extra = InCombat

[CriticalMultiplierRule1]
Bonus = 1
Feat = 4
