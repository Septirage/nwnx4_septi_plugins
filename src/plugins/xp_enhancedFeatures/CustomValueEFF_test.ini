# Test config for the CustomValue system. Point CustomValueRuleFile at this file
# and set CustomValuesNb >= 5 in xp_enhancedFeatures.ini to try it out.
#
# Layout:
#   0 = Raw          (plain get/set, no rule)
#   1 = Computed      Bonus 5 always, +3 more while InCombat (tests summed rules + Extra)
#   2 = Computed      2x CustomValue(0) (tests cross-referencing a Raw index)
#   3 = Evolution     +1 every 10s, unconditional (tests the basic tick)
#   4 = Evolution     -2 every 15s, only while InCombat (tests conditional Evolution)

[General]
ComputedValues = 1 2
EvolutionValues = 3:10 4:15

[CustomValueRule1]
CustomValue = 1
Bonus = 5

[CustomValueRule2]
CustomValue = 1
Bonus = 3
Extra = InCombat

[CustomValueRule3]
CustomValue = 2
Bonus = CustomValue(0) * 2

# Uncomment to check the Computed-cannot-reference-Computed guard: this should be
# rejected at load time with an error in the log ("cannot reference another Computed
# CustomValue"), and CustomValueRule4 itself should simply not be applied.
#[CustomValueRule4]
#CustomValue = 1
#Bonus = CustomValue(2)

[CustomValueEvolutionRule1]
CustomValue = 3
Bonus = 1

[CustomValueEvolutionRule2]
CustomValue = 4
Bonus = -2
Extra = InCombat
