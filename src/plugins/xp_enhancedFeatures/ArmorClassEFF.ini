# Only for example. Nothing in it is on the base game
#
# Rules modifying the Armor Class. One kind of section: [ACRuleX]
#   Type  : DODGE, NATURAL, ARMOR, SHIELD, DEFLECTION, UNTYPED or INNATE. Required.
#   Bonus : value or expression. Required. A negative value is a penalty.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#
# Each rule behaves as an AC effect of its type:
#   DODGE      : stacks with everything. Total of the dodge bonuses capped at 20 by the engine.
#                Lost when the creature is denied its Dexterity (flat-footed...).
#   NATURAL, ARMOR, SHIELD : does not stack. Only counts when better than the best bonus of the same type
#                already on the creature (effects, item properties, "versus" effects, other rules).
#                Lost on a touch attack.
#   DEFLECTION : does not stack, as above. Never lost.
#   UNTYPED    : stacks with everything. Never lost.
#   INNATE     : stacks with everything. Lost on a touch attack. Same behavior as the hardcoded feat AC of the
#                game (Pale Master, Dragon Disciple...).
#
# Penalties (negative Bonus) follow the same logic on the penalty side: a non stacking penalty only counts
# when worse than the worst penalty of the same type already on the creature. Dodge, untyped and innate
# penalties stack.
#
# Nothing is stored: everything is computed again for each AC calculation (character sheet, each attack).
# Removing an item or an effect is taken into account at once.
# A reference to another rule (Rule2, !Rule2) only sees the rules of the same Type, as in the other rule files.
# As always, a rule can only reference the rules before it.


[General]
DisableHook = 0


[ACRule1]
Type = DODGE
Bonus = 1
Extra = InCombat

[ACRule2]
Type = DEFLECTION
Bonus = 2
Feat = 4

[ACRule3]
Type = DEFLECTION
Bonus = 1
Extra = !Rule2
