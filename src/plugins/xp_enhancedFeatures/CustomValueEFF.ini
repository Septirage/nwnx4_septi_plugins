# Configuration for the CustomValue system (Get/SetCustomValue_EFF).
# Every index not listed below stays Raw: it's only ever read/written directly
# from NWScript, nothing here touches it.

[General]
# Space-separated list of indices whose value is computed from the [CustomValueRuleN]
# rules below instead of being read directly from memory.
#ComputedValues =

# Space-separated list of "index:period" pairs (period in seconds) whose value evolves
# on its own over time (regen/degen, via the [CustomValueEvolutionRuleN] rules below),
# on top of whatever is set from NWScript.
#EvolutionValues =

# An index cannot be both Computed and Evolution.


# Computed: for every index declared in ComputedValues, the CustomValue is the sum of
# the Bonus of every CustomValueRuleN below whose conditions match (evaluated live on
# every read), 0 if none match. Same syntax as the other rule files (SkillFeatsEFF.ini,
# ...): Feat/Area/Extra are optional conditions, RuleN in Extra references whether an
# earlier CustomValueRuleN matched. CustomValue(n) can be used in Bonus and Extra, but
# never to reference another Computed index.

#[CustomValueRule1]
#CustomValue = 0
#Bonus = 10
#Extra = MONKPOWER

#[CustomValueRule2]
#CustomValue = 0
#Bonus = ClassLevelSum(5)
#Feat = 1772



# Evolution: for every index declared in EvolutionValues, once its Period has elapsed,
# the sum of the Bonus of every CustomValueEvolutionRuleN below whose conditions match
# is added to the stored value (0 if none match). Separate rule numbering from
# CustomValueRuleN above (its own RuleN references in Extra). CustomValue(n) can freely
# reference any other index, Computed included.

#[CustomValueEvolutionRule1]
#CustomValue = 1
#Bonus = -1
#Extra = MONKPOWER
