# Only for example. Nothing in it is on the base game
#
# Rules adding a bonus to the attack bonus (character sheet, attacks, touch attacks).
#   Bonus : value or expression. Required.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#
# After a change of a condition used here (custom value, mode...), RefreshCombatInformation_EFF
# can be used to update the character sheet.


[General]
DisableHook = 0


[BonusAttackRule1]
Bonus = 1
Feat = 4

[BonusAttackRule2]
Bonus = 2
Extra = InCombat & !Rule1
