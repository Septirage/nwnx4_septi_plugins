# Only for example. Nothing in it is on the base game
#
# Rules adding a bonus to the saving throws. The bonus counts everywhere: character sheet and every save.
#   Save  : FORT, REFLEX, WILL or ALL (several separated by spaces). Required.
#   Bonus : value or expression. Required.
#   Feat / Area / Extra : optional conditions, same syntax as the other rule files.
#   SaveType : optional. The bonus then only applies to the saves against this type, at the save roll (not shown on
#              the character sheet). Name of a SAVING_THROW_TYPE_* constant (FEAR, POISON, MIND_SPELLS, DISEASE,
#              DEATH, TRAP, SPELL...) or its number. SPELL also applies when a save of another type comes from a spell.
#
# A reference to another rule (Rule3, !Rule3) only sees the rules of the save being computed (as for the skills):
# when the Will save is computed, a rule that doesn't cover WILL is never active. Only reference rules that cover
# the same saves. As always, a rule can only reference the rules before it.
# A rule with a SaveType can reference the rules without SaveType of the same save (they are evaluated with it).


[General]
# 1 = the feat bonuses hardcoded in the engine for the saves (CalculateGenericSaveBonuses) are not
#     applied anymore: this file replaces them. Everything else (class, ability, effects) is kept.
RemoveBaseSaveFeatRules = 0


[SaveRule1]
Save = FORT
Bonus = 2
Feat = 4

[SaveRule2]
Save = REFLEX WILL
Bonus = 1
Extra = InCombat

[SaveRule3]
Save = WILL
SaveType = FEAR
Bonus = 4
